<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>CampusConnect | Add Student</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- ================= NAVBAR ================= -->

    <header class="navbar">
      <a href="index.html" class="logo">
        <span>CC</span>
        CampusConnect
      </a>

      <nav>
        <a href="index.html" class="active">HOME</a>
        <a href="companies.html">COMPANIES</a>
        <a href="drives.html">PLACEMENT DRIVES</a>
        <a href="contact.html">CONTACT</a>
        <a href="my-applications.html">MY APPLICATIONS</a>
      </nav>

      <a href="login.html" class="login-btn"> LOGIN </a>
    </header>

    <!-- ================= ADD STUDENT ================= -->

    <main class="add-student-section">
      <div class="page-header">
        <div>
          <p class="section-label">CAMPUSCONNECT</p>

          <h1>Register Student</h1>

          <p>Add student details to the CampusConnect placement database.</p>
        </div>
      </div>

      <!-- ================= FORM ================= -->

      <form id="studentForm" class="student-form">
        <!-- PERSONAL INFORMATION -->

        <section class="form-section">
          <h2>Personal Information</h2>

          <div class="form-grid">
            <div class="form-group">
              <label for="fullName"> Full Name * </label>

              <input
                type="text"
                id="fullName"
                placeholder="Enter student's full name"
                required
              />
            </div>

            <div class="form-group">
              <label for="email"> Email * </label>

              <input
                type="email"
                id="email"
                placeholder="Enter student's email"
                required
              />
            </div>

            <div class="form-group">
              <label for="password"> Password * </label>

              <input
                type="password"
                id="password"
                placeholder="Create login password"
                required
              />
            </div>

            <div class="form-group">
              <label for="phone"> Phone Number </label>

              <input type="tel" id="phone" placeholder="Enter phone number" />
            </div>
          </div>
        </section>

        <!-- ACADEMIC INFORMATION -->

        <section class="form-section">
          <h2>Academic Information</h2>

          <div class="form-grid">
            <div class="form-group">
              <label for="rollNumber"> Roll Number * </label>

              <input
                type="text"
                id="rollNumber"
                placeholder="Enter roll number"
                required
              />
            </div>

            <div class="form-group">
              <label for="branch"> Branch * </label>

              <select id="branch" required>
                <option value="">Select Branch</option>

                <option value="CSE">Computer Science & Engineering</option>

                <option value="IT">Information Technology</option>

                <option value="ECE">Electronics & Communication</option>

                <option value="EEE">Electrical & Electronics</option>

                <option value="ME">Mechanical Engineering</option>

                <option value="CE">Civil Engineering</option>
              </select>
            </div>

            <div class="form-group">
              <label for="cgpa"> CGPA * </label>

              <input
                type="number"
                id="cgpa"
                placeholder="Example: 8.5"
                min="0"
                max="10"
                step="0.01"
                required
              />
            </div>

            <div class="form-group">
              <label for="backlogs"> Backlogs </label>

              <input
                type="number"
                id="backlogs"
                placeholder="Example: 0"
                min="0"
                value="0"
              />
            </div>

            <div class="form-group">
              <label for="graduationYear"> Graduation Year * </label>

              <input
                type="number"
                id="graduationYear"
                placeholder="Example: 2027"
                min="2020"
                max="2100"
                required
              />
            </div>
          </div>
        </section>

        <!-- BUTTONS -->

        <div class="form-actions">
          <a href="students.html" class="cancel-btn"> CANCEL </a>

          <button type="submit" class="save-btn">REGISTER STUDENT</button>
        </div>
      </form>
    </main>

    <!-- ================= FOOTER ================= -->

    <footer>
      <p>© 2026 CampusConnect. All rights reserved.</p>
    </footer>

    <!-- ================= JAVASCRIPT ================= -->

    <script src="script.js"></script>
    <script src="add-student.js"></script>
    <script src="navbar.js"></script>
  </body>
</html>
